name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Static tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run scaffold tests
        run: node --test tests/spec.test.mjs
        env:
          # DoD-4 round-trip harness flag: unset/0 enforces the launch-empty
          # invariant; 1 permits a temporary non-empty products.json while the
          # preview round-trip evidence is being captured.
          DOD4_ROUNDTRIP: ${{ vars.DOD4_ROUNDTRIP }}

  preview-smoke:
    name: Preview deploy + smoke
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    # Runs for PRs and main pushes. Fails closed if VERCEL_TOKEN is absent:
    # a missing token means we cannot prove the page deploys, which is a
    # regression of the deploy pipeline by definition.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail closed without VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add a Vercel deploy token (Hobby plan, no cost) as the repo secret VERCEL_TOKEN, then re-run."
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Ensure project exists (idempotent)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel project add opcsite --yes --token "$VERCEL_TOKEN" 2>/dev/null \
            || echo "project already exists — continuing"
      - name: Deploy preview (never production from CI)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL="$(vercel deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"
      - name: Smoke test the live preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/page.html -w '%{http_code}' "$URL" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE — retrying"; sleep 6
          done
          echo "Final status: $CODE"
          [ "$CODE" = "200" ] || { echo "::error::preview did not return 200"; exit 1; }
          grep -qi "Shipped Products" /tmp/page.html \
            || { echo "::error::preview 200 but placeholder content missing"; exit 1; }
          echo "Smoke passed: preview is live and serving the placeholder."
      - name: Post preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.URL;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview deployed and smoke-tested: ${url}`
            });
        env:
          URL: ${{ steps.deploy.outputs.url }}
